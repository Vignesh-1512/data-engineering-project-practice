# ==========================================================
# 📥 PRE-LANDING LAYER
# ==========================================================

pre_landing:
  write_mode: append

  transactions:

    # ----------------------------
    # 🎯 Target Table (UC Managed)
    # ----------------------------
    catalog: retail_medallion_lakehouse
    target_schema: pre_landing
    table_name: transactions

    # ----------------------------
    # 📡 Source Info
    # ----------------------------
    input_path: "https://raw.githubusercontent.com/Vignesh-1512/data-engineering-project-practice/feature/brazillian_e-commerce/projects/retail_medallion_lakehouse/data/transactional_dataset.json"
    file_type: json

    # ----------------------------
    # 🌍 Translation Config
    # ----------------------------
    translation:
      catalog: retail_medallion_lakehouse
      schema: translation_dataset
      table_name: language_converter
      source_column: Column_Name
      target_column: Convert_Into
      apply_on:
        - root
        - items

    # ----------------------------
    # 🔄 Transformations
    # ----------------------------
    explode_columns:
      - items

    contacts:
      parent: "customer.contacts"
      type_field: "type"
      value_field: "value"
      mappings:
        email: "customer_email"
        phone: "customer_phone"

    # ----------------------------
    # 📑 Final Column Selection
    # ----------------------------
    select_columns:
      - "transaction_id"
      - "customer.cust_id as customer_id"
      - "customer.name as customer_name"
      - "item.product_id"
      - "item.product_name"
      - "item.qty as quantity"
      - "item.unit_price as price"
      - "transaction_ts"
      - "location"


  payments:
    catalog: retail_medallion_lakehouse
    target_schema: pre_landing
    table_name: payments

    input_path: "https://raw.githubusercontent.com/Vignesh-1512/data-engineering-project-practice/feature/brazillian_e-commerce/projects/retail_medallion_lakehouse/data/payment_dataset.json"
    file_type: json
    load_type: full

    select_columns:
      - payment_id
      - transaction_id
      - customer_id
      - amount_gross
      - discount_percent
      - discount_amount
      - shipping_fee
      - amount_charged
      - currency
      - payment_method
      - payment_gateway
      - payment_status
      - gateway_response_code
      - payment_ts
      - lineage_source

  products:

    catalog: retail_medallion_lakehouse
    target_schema: pre_landing
    table_name: products

    input_path: "https://raw.githubusercontent.com/Vignesh-1512/data-engineering-project-practice/feature/brazillian_e-commerce/projects/retail_medallion_lakehouse/data/product_dataset.json"
    file_type: json
    load_type: full


    # Direct select
    select_columns:
      - "product_id"
      - "name"
      - "category"
      - "tags"
      - "price"
      - "gst_percent"


# ==========================================================
# 📥 LANDING LAYER
# ==========================================================
landing:
    write_mode: overwrite

    transactions:
        #------------------------------------
        # SOURCE
        #------------------------------------
        catalog: retail_medallion_lakehouse
        source_schema: pre_landing
        source_table: transactions
        #------------------------------------
        # TARGET
        #------------------------------------
        target_schema: landing
        target_table: landing_transactions

        #------------------------------------
        # CAST RULE
        #------------------------------------
        casts:
            transaction_ts: timestamp
            price: double
            quantity: bigint
        
        #------------------------------------
        # VALIDATION
        #------------------------------------
        not_null_columns:
            - transaction_id
            - product_id
        
        positive_columns:
            - price
            - quantity
        trim_strings: true

        #------------------------------------
        # AUDIT + LINEAGE
        #------------------------------------

        overwrite_audit: true
        lineage_value: pre_landing

        #------------------------------------
        # PARTITION
        #------------------------------------
        partition_column: transaction_ts
        partition_type: year

        primary_keys:
            - transaction_id
            - product_id

    payments:
        # -------------------------
        # SOURCE
        # -------------------------
        catalog: retail_medallion_lakehouse
        source_schema: pre_landing
        source_table: payments

        # -------------------------
        # TARGET
        # -------------------------
        target_schema: landing
        target_table: landing_payments

        # -------------------------
        # CAST RULES
        # -------------------------
        casts:
            payment_ts: timestamp
            amount_gross: double
            discount_percent: double
            discount_amount: double
            shipping_fee: double
            amount_charged: double

        # -------------------------
        # VALIDATIONS
        # -------------------------
        not_null_columns:
            - payment_id
            - transaction_id

        positive_columns:
            - amount_charged

        trim_strings: true

        # -------------------------
        # DEDUP (OPTIONAL BUT SAFE)
        # -------------------------
        primary_keys:
            - payment_id

        # -------------------------
        # AUDIT + LINEAGE
        # -------------------------
        overwrite_audit: true
        lineage_value: pre_landing

        # -------------------------
        # PARTITION
        # -------------------------
        partition_column: payment_ts
        partition_type: year

    products:

        # ------------------------------------
        # SOURCE
        # ------------------------------------
        catalog: retail_medallion_lakehouse
        source_schema: pre_landing
        source_table: products

        # ------------------------------------
        # TARGET
        # ------------------------------------
        target_schema: landing
        target_table: landing_products

        # ------------------------------------
        # CAST RULES
        # ------------------------------------
        casts:
            price: double
            gst_percent: bigint

        # ------------------------------------
        # VALIDATION
        # ------------------------------------
        not_null_columns:
            - product_id

        positive_columns:
            - price
            - gst_percent

        trim_strings: true

        # ------------------------------------
        # AUDIT + LINEAGE
        # ------------------------------------
        overwrite_audit: true
        lineage_value: pre_landing

        # ------------------------------------
        # NO PARTITION NEEDED
        # ------------------------------------
        partition_column: null
        partition_type: null


#-------------------------------------------
#
#  UNIFICATION LAYER
#
#-------------------------------------------

unification:
  write_mode: overwrite

  unified_dataset:

    catalog: retail_medallion_lakehouse
    source_schema: landing

    transactions_table: landing_transactions
    payments_table: landing_payments
    products_table: landing_products

    joins:
      - right: payments
        key: transaction_id
        type: left

      - right: products
        key: product_id
        type: left
        

    target_schema: unification
    target_table: unification_retail

    partition_column: transaction_ts
    partition_type: year

    overwrite_audit: true
    lineage_value: landing

refinement:
  write_mode: overwrite

  refined_dataset:

    catalog: retail_medallion_lakehouse
    source_schema: unification
    source_table: unification_retail

    # 👇 Business-ready curated columns
    select_columns:
      - transaction_id
      - payment_id
      - customer_id
      - customer_name
      - customer_email
      - customer_phone
      - location
      - product_id
      - product_name_master
      - category
      - quantity
      - price
      - amount_gross
      - discount_percent
      - discount_amount
      - shipping_fee
      - amount_charged
      - gst_percent
      - currency
      - payment_method
      - payment_status
      - transaction_ts
      - payment_ts

    # 👇 Enable calculations dynamically
    calculations:
      financial:
        enabled: true
      allocation:
        enabled: true

    target_schema: refinement
    target_table: refined_retail

    partition_column: transaction_ts
    partition_type: year

    overwrite_audit: true
    lineage_value: unification

#-------------------------------------------
#
#  PUBLISH LAYER
#
#-------------------------------------------

publish:
  write_mode: overwrite

  catalog: retail_medallion_lakehouse
  source_schema: refinement
  source_table: refined_retail

  target_schema: publish

  dimensions:

    customer_dimension:
      target_table: customer_dimension
      natural_key: customer_id
      surrogate_key: customer_sk
      columns:
        - customer_id
        - customer_name
        - customer_email
        - customer_phone
        - location

    product_dimension:
      target_table: product_dimension
      natural_key: product_id
      surrogate_key: product_sk
      columns:
        - product_id
        - product_name_master
        - category
        - price
        - gst_percent

  facts:

    cleaned_fact_transactions:
      target_table: cleaned_fact_transactions
      columns:
        - transaction_id
        - customer_id
        - product_id
        - quantity
        - net_amount
        - gst_amount
        - final_invoice_amount
        - transaction_ts
      partition_column: transaction_ts
      partition_type: year

    payment_fact:
      target_table: payment_fact
      columns:
        - payment_id
        - transaction_id
        - customer_id
        - amount_charged
        - payment_method
        - payment_status
        - allocation_ratio
        - payment_ts

  aggregates:

    daily_sales_summary:
      target_table: daily_sales_summary
      group_by:
        - transaction_ts
      date_trunc: day
      metrics:
        total_sales: sum(final_invoice_amount)
        total_transactions: count_distinct(transaction_id)
        total_customers: count_distinct(customer_id)

    product_performance:
      target_table: product_performance
      group_by:
        - product_id
      metrics:
        total_quantity_sold: sum(quantity)
        total_revenue: sum(final_invoice_amount)

    customer_lifetime_value:
      target_table: customer_lifetime_value
      group_by:
        - customer_id
      metrics:
        total_spent: sum(final_invoice_amount)
        total_transactions: count_distinct(transaction_id)
        average_order_value: avg(final_invoice_amount)

    payment_success_rate:
      target_table: payment_success_rate
      group_by:
        - payment_method
      metrics:
        success_count: count_if(payment_status == SUCCESS)
        failure_count: count_if(payment_status != SUCCESS)

